<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exp02 — Dual-Stream Architecture</title>
<style>
  body { margin: 0; padding: 24px; background: #f8f7f4; font-family: sans-serif; }
  svg { width: 100%; max-width: 680px; display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- INPUT -->
<rect x="240" y="20" width="200" height="44" rx="8" fill="#e8e6e0" stroke="#9c9a90" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#264653">Input: apex frame sequence</text>

<!-- Input split arrows -->
<line x1="290" y1="64" x2="160" y2="130" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
<line x1="390" y1="64" x2="520" y2="130" stroke="#f4a261" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

<!-- Stream labels -->
<text font-family="sans-serif" font-size="12" x="162" y="108" text-anchor="middle" fill="#2a9d8f">Motion stream</text>
<text font-family="sans-serif" font-size="12" x="520" y="108" text-anchor="middle" fill="#f4a261">Spatial stream</text>

<!-- optical flow -->
<rect x="60" y="130" width="200" height="56" rx="8" fill="#e9f8f7" stroke="#2a9d8f" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="160" y="151" text-anchor="middle" dominant-baseline="central" fill="#264653">TV-L1 Optical flow</text>
<text font-family="sans-serif" font-size="12" x="160" y="169" text-anchor="middle" dominant-baseline="central" fill="#2a9d8f">Frame pairs → u,v fields</text>

<!-- OpenCV face crop -->
<rect x="420" y="130" width="200" height="56" rx="8" fill="#fef3e8" stroke="#f4a261" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="520" y="151" text-anchor="middle" dominant-baseline="central" fill="#264653">OpenCV face crop</text>
<text font-family="sans-serif" font-size="12" x="520" y="169" text-anchor="middle" dominant-baseline="central" fill="#f4a261">Apex frame → face ROI</text>

<!-- Preprocessing arrows -->
<line x1="160" y1="186" x2="160" y2="250" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
<line x1="520" y1="186" x2="520" y2="250" stroke="#f4a261" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

<!-- HSV label -->
<text font-family="sans-serif" font-size="12" x="174" y="222" fill="#2a9d8f">HSV → RGB heatmap</text>

<!-- SwinV2 backbone -->
<rect x="60" y="250" width="200" height="70" rx="8" fill="#264653" stroke="#2a9d8f" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="160" y="270" text-anchor="middle" dominant-baseline="central" fill="#e9f8f7">SwinV2-Tiny</text>
<text font-family="sans-serif" font-size="12" x="160" y="290" text-anchor="middle" dominant-baseline="central" fill="#2a9d8f">Shifted-window attention</text>
<text font-family="sans-serif" font-size="12" x="160" y="305" text-anchor="middle" dominant-baseline="central" fill="#9cb8b5">768-dim feature vector</text>

<!-- ResNet50 backbone -->
<rect x="420" y="250" width="200" height="70" rx="8" fill="#264653" stroke="#f4a261" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="520" y="270" text-anchor="middle" dominant-baseline="central" fill="#fef3e8">ResNet50</text>
<text font-family="sans-serif" font-size="12" x="520" y="290" text-anchor="middle" dominant-baseline="central" fill="#f4a261">Residual conv. blocks</text>
<text font-family="sans-serif" font-size="12" x="520" y="305" text-anchor="middle" dominant-baseline="central" fill="#c4a07a">2048-dim feature vector</text>

<!-- Backbone to fusion arrows -->
<line x1="160" y1="320" x2="280" y2="400" stroke="#2a9d8f" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
<line x1="520" y1="320" x2="400" y2="400" stroke="#f4a261" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

<!-- Concat label -->
<text font-family="sans-serif" font-size="12" x="340" y="390" text-anchor="middle" fill="#888780">concat → 2816-dim</text>

<!-- Fusion head -->
<rect x="190" y="400" width="300" height="70" rx="8" fill="#e9c46a" stroke="#c4942a" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="340" y="418" text-anchor="middle" dominant-baseline="central" fill="#264653">Fusion head</text>
<text font-family="sans-serif" font-size="12" x="340" y="435" text-anchor="middle" dominant-baseline="central" fill="#5a4010">LayerNorm → Dropout(0.5)</text>
<text font-family="sans-serif" font-size="12" x="340" y="450" text-anchor="middle" dominant-baseline="central" fill="#5a4010">Linear(2816 → 3)</text>

<!-- Fusion to output -->
<line x1="340" y1="470" x2="340" y2="530" stroke="#e76f51" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

<!-- Output -->
<rect x="190" y="530" width="300" height="56" rx="8" fill="#e76f51" stroke="#c4542a" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" x="340" y="551" text-anchor="middle" dominant-baseline="central" fill="#fff">Classification logits</text>
<text font-family="sans-serif" font-size="12" x="340" y="569" text-anchor="middle" dominant-baseline="central" fill="#ffe0d8">Positive · Negative · Surprise</text>

<!-- Loss annotation -->
<text font-family="sans-serif" font-size="12" x="497" y="558" fill="#888780">Weighted focal loss</text>

<!-- Side annotations -->
<text font-family="sans-serif" font-size="11" x="20" y="235" fill="#aaa8a0">pretrained</text>
<text font-family="sans-serif" font-size="11" x="20" y="245" fill="#aaa8a0">ImageNet-22K</text>
<text font-family="sans-serif" font-size="11" x="660" y="235" text-anchor="end" fill="#aaa8a0">pretrained</text>
<text font-family="sans-serif" font-size="11" x="660" y="245" text-anchor="end" fill="#aaa8a0">ImageNet-1K</text>

</svg>
</body>
</html>
